<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Student Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="sidebar">
    <h2>Dashboard here</h2>
    <button onclick="showAll()">All Students</button>
</div>

<div class="main">

    <h1>Student Management Dashboard</h1>

    <!-- STATS -->
    <div class="cards">
        <div class="card">
            <h3>Total Students</h3>
            <p id="totalCount">0</p>
        </div>
    </div>

    <!-- INPUT FORM -->
    <div class="form">
        <input type="text" id="name" placeholder="Student Name">
        <input type="text" id="roll" placeholder="Roll Number">
        <button onclick="addStudent()">Add Student</button>
    </div>

    <input type="text" id="search" placeholder="Search student..." onkeyup="searchStudent()">

    <!-- TABLE -->
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Roll No</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody id="tableBody"></tbody>
    </table>

</div>

<script src="script.js"></script>

</body>
</html>
